name: build

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout VSCodeVim
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        if: matrix.os != 'windows-latest'
        run: pnpm prettier:check

      - name: Lint
        if: matrix.os != 'windows-latest'
        run: pnpm lint

      - name: Build
        run: pnpm build

      # @vscode/test-electron downloads the latest stable VS Code unless it's already in .vscode-test
      - name: Get latest VS Code version
        id: vscode-version
        continue-on-error: true
        shell: bash
        run: |
          version=$(curl -sf 'https://update.code.visualstudio.com/api/releases/stable?released=true' | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code
        if: steps.vscode-version.outputs.version
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ steps.vscode-version.outputs.version }}

      - name: Test on ubuntu-latest
        if: matrix.os != 'windows-latest'
        run: |
          pnpm build-test
          xvfb-run -a pnpm test

      - name: Test on windows-latest
        if: matrix.os == 'windows-latest'
        run: |
          pnpm build-test
          pnpm test
